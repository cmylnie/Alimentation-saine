<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23382B">
<meta name="description" content="Menus de la semaine, recettes, calories et liste de courses.">
<title>Mon Assiette</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="todayLabel"></p>
      <h1 id="pageTitle">Mon Assiette</h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Réglages">⚙</button>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="semaine"><span class="glyph">▦</span><span class="lbl">Semaine</span></button>
    <button class="tab" data-tab="recettes"><span class="glyph">❦</span><span class="lbl">Recettes</span></button>
    <button class="tab" data-tab="composer"><span class="glyph">✎</span><span class="lbl">Composer</span></button>
    <button class="tab" data-tab="courses"><span class="glyph">☑</span><span class="lbl">Courses</span></button>
  </nav>
</div>
<label class="fab hide" id="fab" aria-label="Prendre mon repas en photo">📷<input type="file" accept="image/*" class="hide" id="quickPhoto"></label>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast hide" id="toast"></div>
<noscript><p style="padding:20px">Cette application a besoin de JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
